<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Resume — View</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
      .pdf-wrap { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
      .pdf-bar { padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--line); display:flex; gap:12px; align-items:center; }
      .pdf-embed { width:100%; height:100%; border:0; }
      .pdf-fallback { padding:24px; color:var(--ink4); }
    </style>
  </head>
  <body>
    <div class="pdf-wrap">
      <div class="pdf-bar">
        <a href="/" style="color:var(--ink2);text-decoration:none">← Back</a>
        <div style="flex:1"></div>
        <a href="/static/resume.pdf" target="_blank" rel="noopener" style="color:var(--ac);">Open raw PDF in new tab</a>
        <a href="/static/resume.pdf" download style="margin-left:12px;color:var(--ink2);">Download</a>
      </div>
      <div>
        <embed src="https://raw.githubusercontent.com/Ra59s-Das/stackloom/assets/static/resume.pdf" type="application/pdf" class="pdf-embed">
        <div class="pdf-fallback">
          Your browser does not support embedded PDFs. <a href="https://raw.githubusercontent.com/Ra59s-Das/stackloom/assets/static/resume.pdf" target="_blank" rel="noopener">Open the PDF</a> instead.
        </div>
      </div>
    </div>
  </body>
</html>
